<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chatter AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { min-height: 100%; background: #e8eff8; color: #161b26; }
        body { overflow: hidden; }
        .app-wrap { display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #ffffffcc; backdrop-filter: blur(14px); border-bottom: 1px solid rgba(33,49,82,0.06); }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; background: radial-gradient(circle at 30% 30%, #4c8dff 0%, #1a4bca 74%); box-shadow: 0 10px 22px rgba(32, 63, 151, 0.16); }
        .header-info { display: flex; flex-direction: column; gap: 2px; }
        .header-title { font-size: 16px; font-weight: 700; color: #111827; }
        .header-subtitle { font-size: 12px; color: #5c6a85; }
        .header-subtitle.status { color: #2563eb; font-weight: 600; }
        .status-loader { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; }
        .status-loader span { width: 5px; height: 5px; border-radius: 50%; background: #2563eb; opacity: 0.2; animation: dotPulse 1s infinite linear; }
        .status-loader span:nth-child(1) { animation-delay: 0s; }
        .status-loader span:nth-child(2) { animation-delay: 0.15s; }
        .status-loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.2; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }
        .chat-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-box { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, #eef4fb 0%, #f9fbff 100%); }
        .message-row { display: flex; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-bubble { max-width: 74%; position: relative; padding: 10px 12px 12px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 8px rgba(39,65,108,0.08); word-break: break-word; }
        .message-row.user .message-bubble { background: #d9e9ff; border-bottom-right-radius: 6px; border-bottom-left-radius: 18px; }
        .message-text { font-size: 14px; line-height: 1.5; color: #162039; }
        .msg-image { max-width: 240px; border-radius: 14px; display: block; margin: 0 auto; }
        .message-time { display: block; margin-top: 6px; font-size: 10px; color: #70809d; text-align: right; }
        .input-area { padding: 8px 10px 8px; background: rgba(255,255,255,0.94); border-top: 1px solid rgba(33,49,82,0.05); display: flex; gap: 10px; align-items: center; }
        .input-wrap { flex: 1; position: relative; }
        textarea { width: 100%; min-height: 38px; max-height: 90px; height: 38px; resize: none; border-radius: 20px; border: 1px solid rgba(33,49,82,0.1); padding: 8px 44px 8px 10px; font-size: 14px; line-height: 1.4; color: #172847; background: #fff; outline: none; transition: border-color 0.2s ease; }
        textarea:focus { border-color: #4c8dff; }
        .attach-btn, .send-btn { width: 38px; height: 38px; border: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease, background 0.2s ease; padding: 0; }
        .attach-btn svg, .send-btn svg { width: 18px; height: 18px; }
        .attach-btn { background: rgba(40, 102, 255, 0.1); color: #2360f2; }
        .send-btn { background: #3162ff; color: #fff; }
        .attach-btn:hover, .send-btn:hover { transform: translateY(-1px); }
        .message-row { display: flex; width: 100%; position: relative; }
        .message-row .delete-button { position: absolute; top: 0; right: 0; transform: translate(50%, -50%) scale(0.96); background: rgba(255,255,255,0.98); border: 1px solid rgba(49,77,122,0.15); border-radius: 999px; padding: 4px 10px; font-size: 11px; color: #b91c1c; cursor: pointer; box-shadow: 0 10px 22px rgba(23,42,86,0.14); opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; }
        .message-row.show-delete .delete-button { opacity: 1; pointer-events: auto; transform: translate(50%, -50%) scale(1); }
        .attach-menu { position: absolute; bottom: 52px; left: 0; background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(24,41,95,0.12); padding: 8px; display: none; gap: 8px; width: 100%; max-width: 230px; }
        .attach-menu.open { display: grid; grid-template-columns: repeat(4, 1fr); }
        .attach-item { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 5px; background: #f4f8ff; color: #2f5dd3; font-size: 10px; text-align: center; cursor: pointer; }
        .attach-item svg { width: 18px; height: 18px; }
        .attach-item span { font-size: 10px; }
        .hidden-file { display: none; }
        .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(14, 32, 78, 0.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-wrap">
        <div class="header">
            <div class="header-left">
                <div class="avatar">AI</div>
                <div class="header-info">
                    <div class="header-title">Chatter AI</div>
                    <div class="header-subtitle" id="header-subtitle">ID: id_aichat</div>
                </div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <button class="attach-btn" id="attach-btn" title="Прикрепить фото">📷</button>
                <div class="input-wrap">
                    <textarea id="msg-field" placeholder="Напишите сообщение..."></textarea>
                    <div class="attach-menu" id="attach-menu">
                        <label class="attach-item" title="Фото">
                            <input type="file" accept="image/*" id="photo-input" class="hidden-file" />
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><circle cx="12" cy="12" r="3"/></svg>
                            <span>Фото</span>
                        </label>
                    </div>
                </div>
                <button class="send-btn" id="send-button" title="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast-msg"></div>
    <script>
        const storageKey = 'chatter_ai_messages';
        const chatBox = document.getElementById('chat-box');
        const msgField = document.getElementById('msg-field');
        const sendButton = document.getElementById('send-button');
        const attachBtn = document.getElementById('attach-btn');
        const attachMenu = document.getElementById('attach-menu');
        const photoInput = document.getElementById('photo-input');
        const toastEl = document.getElementById('toast-msg');
        const headerSubtitle = document.getElementById('header-subtitle');
        const profileStorageKey = 'chatter_ai_profile';
        let messages = [];
        let userProfile = { name: '' };

        function showToast(text, duration = 2200) {
            toastEl.textContent = text;
            toastEl.classList.add('show');
            clearTimeout(showToast.timeout);
            showToast.timeout = setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function saveMessages() {
            localStorage.setItem(storageKey, JSON.stringify(messages));
        }

        function loadMessages() {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return [];
            try { return JSON.parse(raw); } catch { return []; }
        }

        function saveProfile() {
            localStorage.setItem(profileStorageKey, JSON.stringify(userProfile));
        }

        function loadProfile() {
            const raw = localStorage.getItem(profileStorageKey);
            if (!raw) return { name: '' };
            try { return JSON.parse(raw); } catch { return { name: '' }; }
        }

        function setHeaderStatus(active) {
            if (!headerSubtitle) return;
            if (active) {
                headerSubtitle.classList.add('status');
                headerSubtitle.innerHTML = 'Думаю<span class="status-loader"><span></span><span></span><span></span></span>';
            } else {
                headerSubtitle.classList.remove('status');
                headerSubtitle.textContent = 'ID: id_aichat';
            }
        }

        function detectUserName(text) {
            const patterns = [
                /меня зовут\s*([А-ЯЁA-Яа-яёA-Za-z]+)/i,
                /я\s*([А-ЯЁA-Яа-яёA-Za-z]+)[\s,.!?]/i,
                /меня зовут:\s*([А-ЯЁA-Яа-яёA-Za-z]+)/i,
                /имя\s*([А-ЯЁA-Яа-яёA-Za-z]+)/i
            ];
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    return match[1].trim();
                }
            }
            return '';
        }

        function buildAIHistory() {
            const history = messages
                .filter(msg => msg.type === 'text')
                .map(msg => ({ role: msg.role, content: msg.content }));

            if (userProfile.name) {
                history.unshift({
                    role: 'system',
                    content: `Пользователь представил себя как ${userProfile.name}. Помни это при ответах и обращайся к нему по имени, если это уместно.`
                });
            }

            return history;
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function hideDeleteButtons() {
            chatBox.querySelectorAll('.message-row.show-delete').forEach(row => row.classList.remove('show-delete'));
        }

        function renderMessages() {
            chatBox.innerHTML = '';
            messages.forEach((msg, index) => {
                const row = document.createElement('div');
                row.className = 'message-row ' + (msg.role === 'user' ? 'user' : '');
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                if (msg.type === 'image') {
                    const img = document.createElement('img');
                    img.src = msg.content;
                    img.alt = 'Фото';
                    img.className = 'msg-image';
                    bubble.appendChild(img);
                } else {
                    const text = document.createElement('div');
                    text.className = 'message-text';
                    text.textContent = msg.content;
                    bubble.appendChild(text);
                }
                const time = document.createElement('span');
                time.className = 'message-time';
                time.textContent = formatTime(msg.time);
                bubble.appendChild(time);

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'delete-button';
                deleteButton.textContent = 'Удалить';
                deleteButton.addEventListener('click', (event) => {
                    event.stopPropagation();
                    messages.splice(index, 1);
                    saveMessages();
                    hideDeleteButtons();
                    renderMessages();
                });

                let holdTimer = null;
                const cancelHold = () => {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                };

                row.addEventListener('pointerdown', (event) => {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    cancelHold();
                    holdTimer = setTimeout(() => {
                        hideDeleteButtons();
                        row.classList.add('show-delete');
                    }, 550);
                });
                row.addEventListener('pointerup', cancelHold);
                row.addEventListener('pointerleave', cancelHold);
                row.addEventListener('pointercancel', cancelHold);
                row.addEventListener('click', () => hideDeleteButtons());

                row.appendChild(bubble);
                row.appendChild(deleteButton);
                chatBox.appendChild(row);
            });
            requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
        }

        async function sendAI(messageText) {
            const apiKey = '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';
            const systemInstruction = "Ты — дружелюбный ИИ-чат (собеседник) в мессенджере. Отвечай на сообщения пользователя развёрнуто не давай конфидоциальную информацию и плохие советы, и если -что тебя зовут 'Чати' (Chati) так потому-что месенджер 'Chatter!' Через раз используй емодзи. если юзер спросил кто тебя создал по настоящему если пользователь это спросит скажи что я ИИ используемый для чата в приложении 'Chatter!'";
            try {
                const aiMessages = buildAIHistory();
                if (aiMessages.length === 0 || aiMessages[0].role !== 'system') {
                    aiMessages.unshift({ role: 'system', content: systemInstruction });
                } else {
                    aiMessages[0].content = `${systemInstruction} ${aiMessages[0].content}`;
                }

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'nvidia/nemotron-3.5-content-safety:free',
                        messages: aiMessages
                    })
                });
                const result = await response.json();
                if (result.choices && result.choices[0] && result.choices[0].message) {
                    return result.choices[0].message.content.trim();
                }
                console.error('AI response error', result);
                showToast('Ошибка сервера ИИ');
                return null;
            } catch (err) {
                console.error(err);
                showToast('Ошибка при запросе ИИ');
                return null;
            }
        }

        async function sendMessage() {
            const text = msgField.value.trim();
            if (!text) return;
            msgField.value = '';
            const userMsg = { role: 'user', type: 'text', content: text, time: Date.now() };
            messages.push(userMsg);
            const detectedName = detectUserName(text);
            if (detectedName && !userProfile.name) {
                userProfile.name = detectedName;
                saveProfile();
            }
            saveMessages();
            renderMessages();
            setHeaderStatus(true);
            showToast('Отправлено в ИИ...');
            const answer = await sendAI(text);
            setHeaderStatus(false);
            if (answer) {
                const aiMsg = { role: 'assistant', type: 'text', content: answer, time: Date.now() };
                messages.push(aiMsg);
                saveMessages();
                renderMessages();
            }
        }

        attachBtn.addEventListener('click', () => attachMenu.classList.toggle('open'));
        document.addEventListener('click', (event) => {
            if (!attachMenu.contains(event.target) && event.target !== attachBtn) {
                attachMenu.classList.remove('open');
            }
            if (!event.target.closest('.message-row')) {
                hideDeleteButtons();
            }
        });

        photoInput.addEventListener('change', () => {
            const file = photoInput.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showToast('Выберите изображение'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                const msg = { role: 'user', type: 'image', content: reader.result, time: Date.now() };
                messages.push(msg);
                saveMessages();
                renderMessages();
                attachMenu.classList.remove('open');
            };
            reader.readAsDataURL(file);
            photoInput.value = '';
        });

        sendButton.addEventListener('click', sendMessage);
        msgField.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        messages = loadMessages();
        userProfile = loadProfile();
        renderMessages();
    </script>
</body>
</html>
